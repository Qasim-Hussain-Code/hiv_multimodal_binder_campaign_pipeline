# Bench tier this repository was built under. Read by 00_configure.sh and
# run_all.sh, and repeated in the README.
#
# A  no wet lab. The repository ends at a hash-stamped pre-registration and a
#    costed assay plan. This is a complete deliverable.
# B  Env-pseudotyped single-round neutralization in TZM-bl cells. Additive
#    stage 17 only. Containment requirement to be confirmed with the
#    institutional biosafety committee, not taken from this file.
# C  replication-competent virus. Only where containment and approvals exist.
#
# The default is A. Nothing in this repository was tested at a bench.
BENCH_TIER=A

# Filled in only for tiers B and C. Left empty at tier A on purpose.
BIOSAFETY_APPROVAL_REF=""
BIOSAFETY_APPROVAL_DATE=""
